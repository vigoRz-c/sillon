<!doctype html>
<html lang="fr">
  <!-- Démo navigateur : affiche les VRAIES pages de src/renderer/pages dans une iframe,
       avec le faux pont (fake-bridge.js) injecté avant leurs scripts. Voir index.js.
       À ouvrir depuis un serveur HTTP à la racine du dépôt, par exemple :
         npx --yes http-server -p 8080     puis     http://localhost:8080/demo/ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sillon · démo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font:
          14px system-ui,
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 6px 10px;
        background: #1b1b1b;
      }
      header strong {
        margin-right: 4px;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select {
        background: #2a2a2a;
        color: inherit;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 2px 4px;
      }
      #hint {
        opacity: 0.7;
      }
      #error {
        color: #ff8a8a;
      }
      iframe {
        display: block;
        width: 100%;
        height: calc(100% - 44px);
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Démo Sillon</strong>
      <label
        >Page
        <select id="page">
          <option value="widget">Scène (bandeau)</option>
          <option value="fullscreen">Plein écran</option>
          <option value="settings">Paramètres</option>
          <option value="controls">Boutons du panneau</option>
        </select>
      </label>
      <label
        >Visualiseur
        <select id="style"></select
      ></label>
      <label
        >Couleurs
        <select id="theme"></select
      ></label>
      <label
        >Mode
        <select id="mode">
          <option value="wallpaper">Fond d'écran</option>
          <option value="top">Au premier plan</option>
          <option value="normal">Fenêtre normale</option>
        </select>
      </label>
      <span id="hint">Clique dans la page pour activer le son de synthèse.</span>
      <span id="error" hidden></span>
    </header>
    <iframe id="frame" title="Aperçu de Sillon"></iframe>

    <!-- Catalogue partagé avec l'application (visualiseurs et couleurs). -->
    <script src="../src/renderer/shared/catalog.js"></script>
    <script src="index.js"></script>
  </body>
</html>
