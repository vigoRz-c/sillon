<!doctype html>
<html lang="en">
  <!-- Browser demo: shows the REAL pages of src/renderer/pages in an iframe,
       with the fake bridge (fake-bridge.js) injected before their scripts. See index.js.
       Open it from an HTTP server at the root of the repository, for example:
         npx --yes http-server -p 8080     then     http://localhost:8080/demo/ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sillon · demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font:
          14px system-ui,
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 6px 10px;
        background: #1b1b1b;
      }
      header strong {
        margin-right: 4px;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select {
        background: #2a2a2a;
        color: inherit;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 2px 4px;
      }
      #hint {
        opacity: 0.7;
      }
      #error {
        color: #ff8a8a;
      }
      iframe {
        display: block;
        width: 100%;
        height: calc(100% - 44px);
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Sillon demo</strong>
      <label
        >Page
        <select id="page">
          <option value="widget">Scene (strip)</option>
          <option value="fullscreen">Full screen</option>
          <option value="settings">Settings</option>
          <option value="controls">Panel buttons</option>
        </select>
      </label>
      <label
        >Visualizer
        <select id="style"></select
      ></label>
      <label
        >Colors
        <select id="theme"></select
      ></label>
      <label
        >Mode
        <select id="mode">
          <option value="wallpaper">Wallpaper</option>
          <option value="top">Always on top</option>
          <option value="normal">Normal window</option>
        </select>
      </label>
      <span id="hint">Click in the page to turn on the synthesized sound.</span>
      <span id="error" hidden></span>
    </header>
    <iframe id="frame" title="Sillon preview"></iframe>

    <!-- Catalog shared with the application (visualizers and colors). -->
    <script src="../src/renderer/shared/catalog.js"></script>
    <script src="index.js"></script>
  </body>
</html>
