<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title data-i18n="fullscreen.title">Sillon · full screen</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="fullscreen">
    <main>
      <h1 class="sr-only" data-i18n="fullscreen.title">Sillon · full screen</h1>
      <div id="room"><img id="roomImg" alt="" /></div>
      <div id="shade" aria-hidden="true"></div>
      <canvas id="ripples" aria-hidden="true"></canvas>
      <canvas id="viz" aria-hidden="true"></canvas>
      <img id="cover" class="big-cover hidden" alt="" />

      <div id="lyrics" class="lyrics fs-lyrics"></div>

      <div class="fs-meta">
        <div id="title" class="title"></div>
        <div id="artist" class="artist"></div>
      </div>

      <button
        id="settingsBtn"
        class="settings-btn"
        type="button"
        title="Settings"
        aria-label="Open settings"
        data-i18n-attr="title:common.settings;aria-label:common.openSettings"
      >
        &#9881;
      </button>

      <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="veilleStatus" class="sr-only" role="status"></div>

      <div
        id="controls"
        class="controls"
        role="group"
        aria-label="Playback controls"
        data-i18n-attr="aria-label:common.playbackControls"
      >
        <button
          id="prev"
          type="button"
          title="Previous (←)"
          aria-label="Previous track"
          data-i18n-attr="title:fullscreen.prevTitle;aria-label:common.previousTrack"
          aria-keyshortcuts="ArrowLeft"
        >
          &#9198;
        </button>
        <button
          id="play"
          type="button"
          title="Play / pause (Space)"
          aria-label="Play"
          aria-keyshortcuts="Space"
          data-i18n-attr="title:fullscreen.playTitle"
        >
          &#9199;
        </button>
        <button
          id="next"
          type="button"
          title="Next (→)"
          aria-label="Next track"
          aria-keyshortcuts="ArrowRight"
          data-i18n-attr="title:fullscreen.nextTitle;aria-label:common.nextTrack"
        >
          &#9197;
        </button>
        <div
          class="progress wide"
          role="progressbar"
          aria-label="Position in the track"
          data-i18n-attr="aria-label:common.progress"
          aria-valuemin="0"
          aria-valuemax="0"
          aria-valuenow="0"
        >
          <div id="bar"></div>
        </div>
        <div id="time" class="time" aria-hidden="true"></div>
        <div id="volume"></div>
      </div>

      <!-- Shortcut help: read by screen readers, shown only on demand (? or H key). -->
      <div id="keys" class="keys" data-i18n="fullscreen.keys">
        Space play · ← → track · V visualizer · C colors · [ ] lyrics · ? this help · Esc quit. Single-key shortcuts are
        off while a button or slider has focus.
      </div>
    </main>

    <script src="../shared/locales/en.js"></script>
    <script src="../shared/locales/fr.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/catalog.js"></script>
    <script src="../shared/audio-engine.js"></script>
    <script src="../shared/colors.js"></script>
    <script src="../shared/visualizers.js"></script>
    <script src="../shared/engine.js"></script>
    <script src="../shared/common.js"></script>
    <script src="../shared/lyrics-view.js"></script>
    <script src="../shared/volume-control.js"></script>
    <script src="fullscreen.js"></script>
  </body>
</html>
