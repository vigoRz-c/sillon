<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Sillon · plein écran</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="fullscreen">
    <main>
      <h1 class="sr-only">Sillon · plein écran</h1>
      <div id="room"><img id="roomImg" alt="" /></div>
      <div id="shade" aria-hidden="true"></div>
      <canvas id="ripples" aria-hidden="true"></canvas>
      <canvas id="viz" aria-hidden="true"></canvas>
      <img id="cover" class="big-cover hidden" alt="" />

      <div id="lyrics" class="lyrics fs-lyrics"></div>

      <div class="fs-meta">
        <div id="title" class="title"></div>
        <div id="artist" class="artist"></div>
      </div>

      <button id="settingsBtn" class="settings-btn" type="button" title="Paramètres" aria-label="Ouvrir les paramètres">
        &#9881;
      </button>

      <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="veilleStatus" class="sr-only" role="status"></div>

      <div id="controls" class="controls" role="group" aria-label="Commandes de lecture">
        <button
          id="prev"
          type="button"
          title="Précédent (←)"
          aria-label="Morceau précédent"
          aria-keyshortcuts="ArrowLeft"
        >
          &#9198;
        </button>
        <button id="play" type="button" title="Lecture / pause (Espace)" aria-label="Lecture" aria-keyshortcuts="Space">
          &#9199;
        </button>
        <button id="next" type="button" title="Suivant (→)" aria-label="Morceau suivant" aria-keyshortcuts="ArrowRight">
          &#9197;
        </button>
        <div
          class="progress wide"
          role="progressbar"
          aria-label="Position dans le morceau"
          aria-valuemin="0"
          aria-valuemax="0"
          aria-valuenow="0"
        >
          <div id="bar"></div>
        </div>
        <div id="time" class="time" aria-hidden="true"></div>
        <div id="volume"></div>
      </div>

      <!-- Aide des raccourcis : lue par les lecteurs d'écran, affichée seulement à la demande (touche ? ou H). -->
      <div id="keys" class="keys">
        Espace lecture · ← → morceau · V visualiseur · C couleurs · [ ] paroles · ? cette aide · Échap quitter. Les
        raccourcis à une touche sont inactifs quand un bouton ou un curseur a le focus.
      </div>
    </main>

    <script src="../shared/catalog.js"></script>
    <script src="../shared/audio-engine.js"></script>
    <script src="../shared/colors.js"></script>
    <script src="../shared/visualizers.js"></script>
    <script src="../shared/engine.js"></script>
    <script src="../shared/common.js"></script>
    <script src="../shared/lyrics-view.js"></script>
    <script src="../shared/volume-control.js"></script>
    <script src="fullscreen.js"></script>
  </body>
</html>
