[package]
name = "sillon-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Assistant système de Sillon : morceau en cours, volume du lecteur, capture du son du lecteur."
license = "GPL-3.0-only"
publish = false

[dependencies]
serde_json = "1"
base64 = "0.23"
# Même version que « windows » ci-dessous (utilisé par la macro #[implement]).
# Dependabot l'ignore : le monter à la main avec windows.
windows-core = "0.62"
# Types asynchrones WinRT (IAsyncOperation, AsyncStatus) : version imposée par « windows ».
windows-future = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
