# Propose chaque semaine les mises à jour des dépendances et des actions GitHub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      outils:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions épinglées par SHA (voir ci.yml) : Dependabot met à jour le SHA et le
    # commentaire de version, et regroupe les actions en une seule Pull Request.
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: /native/sillon-helper
    schedule:
      interval: weekly
    # windows-core et windows-future doivent garder la même version que « windows »
    # (voir Cargo.toml) : on les met à jour à la main, en même temps que windows.
    ignore:
      - dependency-name: windows-core
      - dependency-name: windows-future
