# Proposes the updates of the dependencies and of the GitHub actions every week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      outils:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions pinned by SHA (see ci.yml): Dependabot updates the SHA and the
    # version comment, and groups the actions into a single Pull Request.
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: /native/sillon-helper
    schedule:
      interval: weekly
    # windows-core and windows-future must keep the same version as "windows"
    # (see Cargo.toml): they are updated by hand, together with windows.
    ignore:
      - dependency-name: windows-core
      - dependency-name: windows-future
