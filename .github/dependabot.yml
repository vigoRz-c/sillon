# Propose chaque semaine les mises à jour des dépendances et des actions GitHub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      outils:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /native/sillon-helper
    schedule:
      interval: weekly
    # windows-core doit garder la même version que windows (voir Cargo.toml) :
    # on le met à jour à la main, en même temps que windows.
    ignore:
      - dependency-name: windows-core
