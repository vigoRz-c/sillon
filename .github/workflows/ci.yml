# Automatic checks on every push and pull request: syntax, quality
# rules (ESLint), formatting, JavaScript tests, native helper (Rust), dependency
# audits and packaging (without publishing).
#
# The actions are pinned by commit SHA (the version tag is in a comment):
# Dependabot proposes their updates (see .github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      # The tests do not need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Types (JSDoc, // @ts-check files)
        run: npm run typecheck
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Tests
        run: npm test

  rust:
    name: Assistant natif (Rust)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/sillon-helper
      # Every cargo command runs in the helper's folder: that is where
      # .cargo/config.toml is (+crt-static). --locked: frozen Cargo.lock.
      - name: Formatting (cargo fmt)
        working-directory: native/sillon-helper
        run: cargo fmt --check
      - name: Clippy (warnings = errors)
        working-directory: native/sillon-helper
        run: cargo clippy --locked -- -D warnings
      - name: Tests (cargo test)
        working-directory: native/sillon-helper
        run: cargo test --locked
      - name: Build (release)
        working-directory: native/sillon-helper
        run: cargo build --release --locked
      - name: No VC++ runtime to install (VCRUNTIME140 absent)
        shell: pwsh
        run: |
          $exe = 'native/sillon-helper/target/release/sillon-helper.exe'
          if (Select-String -Path $exe -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) {
            Write-Error "The helper depends on the Visual C++ redistributable (VCRUNTIME140): check native/sillon-helper/.cargo/config.toml (+crt-static)."
            exit 1
          }
          Write-Host 'OK : VCRUNTIME140 absent de sillon-helper.exe.'

  audit:
    name: Audits de dépendances
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      - name: cargo audit (native helper)
        working-directory: native/sillon-helper
        run: cargo audit

  package:
    name: Empaquetage (sans publication)
    needs: [js, rust]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/sillon-helper
      # Electron is downloaded here: packaging needs it.
      - run: npm ci
      - name: Native helper (release)
        run: node scripts/build-helper.js --strict
      - name: Windows packaging (folder, no installer or publishing)
        run: npx electron-builder --win --dir --publish never
      - name: Electron fuses and helper
        shell: pwsh
        run: |
          $fuses = npx electron-fuses read --app dist/win-unpacked/Sillon.exe | Out-String
          Write-Output $fuses
          foreach ($want in 'RunAsNode is Disabled', 'EnableNodeOptionsEnvironmentVariable is Disabled',
                            'EnableNodeCliInspectArguments is Disabled', 'OnlyLoadAppFromAsar is Enabled') {
            if (-not $fuses.Contains($want)) {
              Write-Error "Electron fuse not applied: expected '$want'."
              exit 1
            }
          }
          if (Select-String -Path dist/win-unpacked/resources/sillon-helper.exe -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) {
            Write-Error 'sillon-helper.exe still depends on VCRUNTIME140.'
            exit 1
          }
