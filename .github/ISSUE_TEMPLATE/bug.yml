name: Bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce bug ! Tu peux aussi m'écrire sur Discord : **`_vigorz_`**.
  - type: textarea
    id: probleme
    attributes:
      label: Que se passe-t-il ?
      description: Ce que tu as fait, ce que tu attendais, ce qui s'est passé à la place.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. …
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic
      description: Paramètres → Diagnostic → « Copier le diagnostic », puis colle-le ici (ni mot de passe ni jeton dedans).
      render: text
    validations:
      required: true
  - type: textarea
    id: captures
    attributes:
      label: Captures d'écran
      description: Facultatif, mais très utile pour un souci d'affichage.
