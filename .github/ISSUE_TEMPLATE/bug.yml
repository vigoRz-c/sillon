name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this bug! You can also write to me on Discord: **`_vigorz_`**.
  - type: textarea
    id: probleme
    attributes:
      label: What happens?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open…
        2. Click on…
        3. …
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic
      description: Settings → Diagnostic → "Copy the diagnostic", then paste it here (no password or token in it).
      render: text
    validations:
      required: true
  - type: textarea
    id: captures
    attributes:
      label: Screenshots
      description: Optional, but very useful for a display problem.
