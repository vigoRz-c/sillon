name: Idea
description: Suggest an improvement or a new feature
labels: [idée]
body:
  - type: textarea
    id: idee
    attributes:
      label: Your idea
      description: What you would like to see in Sillon.
    validations:
      required: true
  - type: textarea
    id: pourquoi
    attributes:
      label: Why
      description: The problem it solves or what it would bring.
  - type: textarea
    id: exemples
    attributes:
      label: Examples
      description: Screenshots, videos, links to an app that already does something close…
